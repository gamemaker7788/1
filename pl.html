<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无需注册的评论系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💬 匿名评论系统</h1>
            <p>无需注册，直接发表评论</p>
        </header>

        <div class="comment-section">
            <div class="comment-form">
                <input type="text" id="username" placeholder="你的昵称（可选）" maxlength="20">
                <textarea id="comment-input" placeholder="分享你的想法..." rows="3" required></textarea>
                <button id="submit-comment" class="btn btn-primary">发布评论</button>
            </div>

            <div id="comments-container" class="comments-container">
                <div class="loading">加载评论中...</div>
            </div>
        </div>

        <footer>
            <p>数据实时同</p>
        </footer>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <!-- 配置文件 -->
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
