<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线发送</title>
    <link rel="icon" type="image/png" href="iorn.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(120deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(45deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .problem, .solution {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            font-weight: bold;
            text-align: left;
            font-size: 16px;
        }
        
        .explanation1 {
            background: #e7f3ff;
            border-radius: 5px;
            border-left: 5px solid #2196F3;
            margin: 15px 0;
            padding: 15px;
        }
        
        .explanation11 {
            background: #e7f3ff;
            border-radius: 5px;
            border-left: 5px solid #2196F3;
            padding: 15px 20px;
            margin: 0;
        }
        
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            min-height: 100px;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        
        button[type="submit"] {
            background: #6a11cb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            font-size: 16px;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        button[type="submit"]:hover {
            background: #2575fc;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 8px;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <form action="https://formsubmit.co/WQC1145142025@outlook.com" method="POST">
        <!-- 基础反垃圾字段（对用户不可见） -->
        <input type="hidden" name="_honeypot" style="display:none">
         
        <div class="header">
            <h1>向我发送信息</h1>
            <p>填充个人信息</p>
        </div>
        
        <div class="container">
            <div class="problem">
                <h2>提交信息</h2>
                
                <div class="explanation1">
                    <label for="name">名字:</label>
                    <input type="text" id="name" name="名字" required>
                </div>
                
                <div class="explanation1">
                    <label for="email">邮箱:</label>
                    <input type="email" id="email" name="邮箱" placeholder="非必填">
                </div>
                
                <div class="explanation1">
                    <label for="region">选择地区:</label>
                    <select id="region" name="地区" required>
                        <option value="+86 中国">+86 中国 (中文)</option>
                        <option value="+44 英国">+44 英国 (English)</option>
                        <option value="+81 日本">+81 日本 (日本語)</option>
                        <option value="+82 韩国">+82 韩国 (한국어)</option>
                        <option value="+91 印度">+91 印度 (हिन्दी)</option>
                        <option value="+49 德国">+49 德国 (Deutsch)</option>
                        <option value="+33 法国">+33 法国 (Français)</option>
                        <option value="+61 澳大利亚">+61 澳大利亚 (English)</option>
                        <option value="+7 俄罗斯">+7 俄罗斯 (Русский)</option>
                        <option value="+39 意大利">+39 意大利 (Italiano)</option>
                        <option value="+34 西班牙">+34 西班牙 (Español)</option>
                        <option value="+55 巴西">+55 巴西 (Português)</option>
                    </select>
                    
                    <label for="phone">电话:</label>
                    <input type="tel" id="phone" name="电话" pattern="[0-9]{11}" required>
                    <label >格式：XXX-XXXX-XXXX</label>
                </div>
                
                
            </div>
            
            <div class="solution">
                <h2>发送信息</h2>
                <textarea name="信息" placeholder="请输入您的意见..." required></textarea> 
                <div class="explanation11">
                    <span>性别:</span>
                    <div>
                        <input type="radio" id="gender-male" name="性别" value="男" checked>
                        
                        <label for="gender-male">男</label>
                    </div>
                    <div>
                        <input type="radio" id="gender-female" name="性别" value="女">
                        
                        <label for="gender-female">女</label>
                    </div>
                    <div>
                        <input type="radio" id="gender-other" name="性别" value="其他">
                        <label for="gender-other">其他</label>
                    </div>
                    
                    <div style="margin-top: 10px;">
                        <input type="checkbox" id="disabled" name="是否残疾" value="否">
                        <label for="disabled">残疾人士</label>
                    </div>
                </div>
                
                <div class="explanation1">
                  <label for="rating">您对此网站的评价:</label>
                    <select name="网站评价" size="1" id="rating" required>
                      <option value="没有选择" selected>请选择...</option>
                        <option value="好">好</option>
                        <option value="不好">不好</option>
                    </select>
                </div>
                
                <button type="submit">发送信息</button>
            </div>
        </div>
    </form>
</body>
</html>
